<!doctype html>
<meta charset="utf-8">
<title>Camera Slider — UI screens</title>
<style>
  body { margin: 0; background: #16161a; color: #cfd4e0;
         font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; color: #fff; }
  p.lede { margin: 0 0 24px; color: #8b93a7; max-width: 70ch; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em;
       color: #6f7a90; margin: 28px 0 10px; }
  .grid { display: flex; flex-wrap: wrap; gap: 18px; }
  figure { margin: 0; }
  figcaption { font-family: ui-monospace, monospace; font-size: 11px;
               color: #8b93a7; margin-top: 6px; }
  canvas { image-rendering: pixelated; display: block; background: #000; }
</style>

<h1>Camera Slider — display reference</h1>
<p class="lede">Every screen the ST7735 160×128 panel can show, rendered with the same
geometry, palette, glyph bitmaps and status-bar icons as
<code>firmware/src/display.cpp</code>. Shown at 4× (640×512); the exported PNGs are 1:1.</p>

<div id="out"></div>

<script src="assets.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// A faithful re-implementation of the drawing primitives Adafruit_GFX gives the
// firmware, so each screen below can be a near line-for-line copy of its
// counterpart in display.cpp. Everything works on a 160x128 RGB565 framebuffer,
// exactly like the panel.
// ─────────────────────────────────────────────────────────────────────────────
const SCREEN_W = 160, SCREEN_H = 128, SCALE = 4;
const HEADER_H = 13, FOOTER_H = 15, CONTENT_BOTTOM = SCREEN_H - FOOTER_H;

function css565(c) {
  const r = ((c >> 11) & 0x1f) * 255 / 31;
  const g = ((c >> 5) & 0x3f) * 255 / 63;
  const b = (c & 0x1f) * 255 / 31;
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

class Tft {
  constructor(ctx) { this.ctx = ctx; this.size = 1; this.fg = 0xFFFF; this.bg = null;
                     this.cx = 0; this.cy = 0; }
  px(x, y, c) {
    if (x < 0 || y < 0 || x >= SCREEN_W || y >= SCREEN_H) return;
    this.ctx.fillStyle = css565(c);
    this.ctx.fillRect(x, y, 1, 1);
  }
  fillRect(x, y, w, h, c) {
    if (w <= 0 || h <= 0) return;
    this.ctx.fillStyle = css565(c);
    this.ctx.fillRect(x, y, w, h);
  }
  fillScreen(c) { this.fillRect(0, 0, SCREEN_W, SCREEN_H, c); }
  drawFastHLine(x, y, w, c) { this.fillRect(x, y, w, 1, c); }
  drawFastVLine(x, y, h, c) { this.fillRect(x, y, 1, h, c); }
  drawRect(x, y, w, h, c) {
    this.drawFastHLine(x, y, w, c); this.drawFastHLine(x, y + h - 1, w, c);
    this.drawFastVLine(x, y, h, c); this.drawFastVLine(x + w - 1, y, h, c);
  }
  // Bresenham circle, same shape Adafruit_GFX produces.
  drawCircle(x0, y0, r, c) {
    let f = 1 - r, ddFx = 1, ddFy = -2 * r, x = 0, y = r;
    this.px(x0, y0 + r, c); this.px(x0, y0 - r, c);
    this.px(x0 + r, y0, c); this.px(x0 - r, y0, c);
    while (x < y) {
      if (f >= 0) { y--; ddFy += 2; f += ddFy; }
      x++; ddFx += 2; f += ddFx;
      this.px(x0 + x, y0 + y, c); this.px(x0 - x, y0 + y, c);
      this.px(x0 + x, y0 - y, c); this.px(x0 - x, y0 - y, c);
      this.px(x0 + y, y0 + x, c); this.px(x0 - y, y0 + x, c);
      this.px(x0 + y, y0 - x, c); this.px(x0 - y, y0 - x, c);
    }
  }
  fillCircle(x0, y0, r, c) {
    this.drawFastVLine(x0, y0 - r, 2 * r + 1, c);
    let f = 1 - r, ddFx = 1, ddFy = -2 * r, x = 0, y = r;
    while (x < y) {
      if (f >= 0) { y--; ddFy += 2; f += ddFy; }
      x++; ddFx += 2; f += ddFx;
      this.drawFastVLine(x0 + x, y0 - y, 2 * y + 1, c);
      this.drawFastVLine(x0 - x, y0 - y, 2 * y + 1, c);
      this.drawFastVLine(x0 + y, y0 - x, 2 * x + 1, c);
      this.drawFastVLine(x0 - y, y0 - x, 2 * x + 1, c);
    }
  }
  fillTriangle(x0, y0, x1, y1, x2, y2, c) {
    const minX = Math.min(x0, x1, x2), maxX = Math.max(x0, x1, x2);
    const minY = Math.min(y0, y1, y2), maxY = Math.max(y0, y1, y2);
    const sign = (ax, ay, bx, by, px, py) => (px - bx) * (ay - by) - (ax - bx) * (py - by);
    for (let y = minY; y <= maxY; y++) {
      for (let x = minX; x <= maxX; x++) {
        const d1 = sign(x0, y0, x1, y1, x, y);
        const d2 = sign(x1, y1, x2, y2, x, y);
        const d3 = sign(x2, y2, x0, y0, x, y);
        const neg = (d1 < 0) || (d2 < 0) || (d3 < 0);
        const pos = (d1 > 0) || (d2 > 0) || (d3 > 0);
        if (!(neg && pos)) this.px(x, y, c);
      }
    }
  }
  drawRGBBitmap(x, y, data, w, h) {
    for (let j = 0; j < h; j++)
      for (let i = 0; i < w; i++) this.px(x + i, y + j, data[j * w + i]);
  }
  setTextSize(s) { this.size = s; }
  setTextColor(fg, bg) { this.fg = fg; this.bg = (bg === undefined) ? null : bg; }
  setCursor(x, y) { this.cx = x; this.cy = y; }
  // Classic 5x7 glyph in a 6x8 cell, scaled -- matches Adafruit_GFX drawChar().
  print(str) {
    for (const ch of String(str)) {
      const code = ch.charCodeAt(0) & 0xff;
      for (let col = 0; col < 5; col++) {
        const bits = GFX_FONT[code * 5 + col];
        for (let row = 0; row < 8; row++) {
          const on = (bits >> row) & 1;
          if (on) this.fillRect(this.cx + col * this.size, this.cy + row * this.size,
                                this.size, this.size, this.fg);
          else if (this.bg !== null)
            this.fillRect(this.cx + col * this.size, this.cy + row * this.size,
                          this.size, this.size, this.bg);
        }
      }
      if (this.bg !== null)  // the blank 6th column of the cell
        this.fillRect(this.cx + 5 * this.size, this.cy, this.size, 8 * this.size, this.bg);
      this.cx += 6 * this.size;
    }
  }
}

// ── Palette: the exact RGB565 tables from display.cpp ────────────────────────
const THEMES = {
  dark:  { bgBase:0x0862, bgPanel:0x10C4, bgCard:0x1928, bgHighlight:0x298A,
           cyan:0x06BF, green:0x074F, amber:0xFD04, red:0xF948, purple:0x931F, sel:0x06BF,
           textPri:0xFFFF, textSec:0x7C97, textDim:0x3A4C, divider:0x1969 },
  light: { bgBase:0xF7BE, bgPanel:0xE75E, bgCard:0xFFFF, bgHighlight:0xD71F,
           cyan:0x0456, green:0x1449, amber:0xB340, red:0xC0E7, purple:0x6A19, sel:0x0456,
           textPri:0x10A3, textSec:0x4AAE, textDim:0x8CB5, divider:0xCEBC },
  hc:    { bgBase:0x0000, bgPanel:0x0000, bgCard:0x0000, bgHighlight:0xFFFF,
           cyan:0x07FF, green:0x07E0, amber:0xFF40, red:0xF800, purple:0xF81F, sel:0x0000,
           textPri:0xFFFF, textSec:0xE73C, textDim:0xAD55, divider:0x632C },
};

let P, tft;   // active palette + canvas wrapper

// ── display.cpp helpers ──────────────────────────────────────────────────────
function textOpaque(x, y, fg, s, width = 0) {
  tft.setTextColor(fg, P.bgBase);
  tft.setCursor(x, y);
  tft.print(s);
  for (let i = String(s).length; i < width; i++) tft.print(' ');
}

function drawStatusBar(st) {
  tft.fillRect(0, 0, SCREEN_W, HEADER_H, P.bgPanel);
  tft.drawRGBBitmap(2, 0, ICONS12[st.bleConnected ? 'bt_on' : 'bt_off'], 12, 12);
  tft.setTextSize(1);
  tft.setTextColor(P.textPri, P.bgPanel);
  tft.setCursor(18, 2);
  tft.print("CAMERA SLIDER");
  const pct = st.batteryPercent;
  const level = pct >= 75 ? 4 : pct >= 50 ? 3 : pct >= 25 ? 2 : pct > 0 ? 1 : 0;
  tft.drawRGBBitmap(SCREEN_W - 14, 0, ICONS12['bat_' + level], 12, 12);
  tft.drawFastHLine(0, HEADER_H - 1, SCREEN_W, P.divider);
}

function drawScreenHeader(title, color = P.textPri) {
  tft.fillRect(0, 0, SCREEN_W, HEADER_H, P.bgPanel);
  tft.setTextSize(1); tft.setTextColor(color, P.bgPanel);
  tft.setCursor(4, 2); tft.print(title);
  tft.drawFastHLine(0, HEADER_H - 1, SCREEN_W, P.divider);
}

function drawPositionBar(x, y, w, st) {
  const h = 10;
  tft.setTextSize(1);
  textOpaque(x, y + 1, st.endstop1 ? P.red : P.textSec, "E1");
  textOpaque(x + w - 12, y + 1, st.endstop2 ? P.red : P.textSec, "E2");
  const barX = x + 16, barW = w - 32;
  const fillColor = st.motorRunning ? P.cyan : P.green;
  let fillW = Math.round(barW * st.frac);
  fillW = Math.max(0, Math.min(barW, fillW));
  if (fillW > 0)    tft.fillRect(barX, y, fillW, h, fillColor);
  if (fillW < barW) tft.fillRect(barX + fillW, y, barW - fillW, h, P.bgCard);
  let tickX = Math.min(barX + fillW, barX + barW - 1);
  tft.drawFastVLine(tickX, y, h, P.textPri);
}

function drawButtonGlyph(x, y, primary, color) {
  if (primary) tft.fillTriangle(x, y, x, y + 7, x + 5, y + 3, color);
  else {
    tft.drawFastHLine(x, y + 1, 6, color);
    tft.drawFastHLine(x, y + 3, 6, color);
    tft.drawFastHLine(x, y + 5, 6, color);
  }
}

function drawHints(btn1, btn2, enc, btn1Dim = false, btn2Dim = false, footerBg = P.bgPanel) {
  tft.fillRect(0, CONTENT_BOTTOM, SCREEN_W, FOOTER_H, footerBg);
  tft.drawFastHLine(0, CONTENT_BOTTOM, SCREEN_W, P.divider);
  tft.setTextSize(1);
  let x = 3, y = CONTENT_BOTTOM + 4;
  if (btn1 !== null) {
    const c = btn1Dim ? P.textDim : P.textSec;
    drawButtonGlyph(x, y, true, c); x += 8;
    tft.setTextColor(c, footerBg); tft.setCursor(x, y); tft.print(btn1);
    x += btn1.length * 6 + 5;
  }
  if (btn2 !== null) {
    const c = btn2Dim ? P.textDim : P.textSec;
    drawButtonGlyph(x, y, false, c); x += 8;
    tft.setTextColor(c, footerBg); tft.setCursor(x, y); tft.print(btn2);
  }
  if (enc) {
    const right = "(o)" + enc;
    tft.setTextColor(P.cyan, footerBg);
    tft.setCursor(SCREEN_W - 3 - right.length * 6, y);
    tft.print(right);
  }
}

function drawList(items, sel) {
  const rowH = 20, startY = HEADER_H;
  const visible = Math.floor((CONTENT_BOTTOM - startY) / rowH);
  let offset = 0;
  if (sel >= visible) offset = sel - visible + 1;
  for (let i = 0; i < visible && (offset + i) < items.length; i++) {
    const idx = offset + i, y = startY + i * rowH, isSel = idx === sel;
    tft.fillRect(0, y, SCREEN_W, rowH, isSel ? P.bgHighlight : P.bgBase);
    if (i > 0) tft.drawFastHLine(0, y, SCREEN_W, P.divider);
    if (isSel) tft.fillRect(0, y, 2, rowH, P.sel);
    tft.setTextSize(1);
    tft.setTextColor(isSel ? P.sel : P.textPri);
    tft.setCursor(8, y + 6);
    tft.print(items[idx].label);
    const val = items[idx].value || "";
    if (val) {
      tft.setTextColor(isSel ? P.sel : P.textSec);
      tft.setCursor(SCREEN_W - 6 - val.length * 6, y + 6);
      tft.print(val);
    }
  }
}

function listHeader(title) {
  tft.fillRect(0, HEADER_H, SCREEN_W, CONTENT_BOTTOM - HEADER_H, P.bgBase);
  drawScreenHeader("< " + title.toUpperCase());
}

function formatSteps(value) {
  return Number(value).toLocaleString('en-US').replaceAll(',', ' ');
}

// ── Menu tile icons (GFX primitives, same as display.cpp) ────────────────────
function iconMove(cx, cy, c) {
  for (let t = -1; t <= 1; t++) tft.drawFastHLine(cx - 13, cy + t, 26, c);
  tft.fillTriangle(cx - 14, cy, cx - 7, cy - 6, cx - 7, cy + 6, c);
  tft.fillTriangle(cx + 14, cy, cx + 7, cy - 6, cx + 7, cy + 6, c);
  tft.fillRect(cx - 3, cy - 8, 6, 16, c);
}
function iconTarget(cx, cy, c) {
  tft.drawCircle(cx, cy, 10, c);
  tft.drawCircle(cx, cy, 9, c);
  tft.drawFastHLine(cx - 15, cy, 8, c);
  tft.drawFastHLine(cx + 8, cy, 8, c);
  tft.drawFastVLine(cx, cy - 15, 8, c);
  tft.drawFastVLine(cx, cy + 8, 8, c);
  tft.fillCircle(cx, cy, 3, c);
}
function iconRuler(cx, cy, c) {
  tft.drawRect(cx - 14, cy - 8, 28, 16, c);
  tft.drawRect(cx - 13, cy - 7, 26, 14, c);
  for (let i = 1; i < 6; i++) {
    const x = cx - 14 + i * 5, len = (i % 2 === 0) ? 8 : 5;
    tft.drawFastVLine(x, cy - 7, len, c);
  }
}
function iconGear(cx, cy, c, bg) {
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    tft.fillRect(cx + Math.trunc(Math.cos(a) * 12) - 3,
                 cy + Math.trunc(Math.sin(a) * 12) - 3, 6, 6, c);
  }
  tft.fillCircle(cx, cy, 10, c);
  tft.fillCircle(cx, cy, 4, bg);
}
const MENU_ICONS = [iconMove, iconTarget, iconRuler, iconGear];

// ── Screens ─────────────────────────────────────────────────────────────────
const S = {
  bleConnected: true, batteryPercent: 78, endstop1: false, endstop2: false,
  motorRunning: false, motorDirection: false, frac: 0.22,
  position: 1234, target: 3000, travel: 5670, center: 2835, speed: 75,
};

function base() { tft.fillScreen(P.bgBase); }

const SCREENS = {
  "main": () => {
    base(); drawStatusBar(S); drawPositionBar(4, 18, SCREEN_W - 8, S);
    const value = formatSteps(S.position), total = "/ " + formatSteps(S.travel) + " TOTAL STEPS";
    tft.setTextSize(3); textOpaque((SCREEN_W - value.length * 18) / 2, 34, P.textPri, value);
    tft.setTextSize(1); textOpaque((SCREEN_W - total.length * 6) / 2, 60, P.textSec, total);
    textOpaque(4, 77, P.textPri, S.speed + "%", 4);
    tft.fillRect(32, 79, SCREEN_W - 58, 5, P.bgCard);
    tft.fillRect(32, 79, Math.floor((SCREEN_W - 58) * S.speed / 100), 5, P.cyan);
    textOpaque(4, 94, P.green, "IDLE", 9);
    drawHints("GO/STOP", "MENU", "GOTO");
  },
  "main-moving": () => {
    const st = { ...S, motorRunning: true, frac: 0.55 };
    base(); drawStatusBar(st); drawPositionBar(4, 18, SCREEN_W - 8, st);
    const value = "3 120", total = "/ 5 670 TOTAL STEPS";
    tft.setTextSize(3); textOpaque((SCREEN_W - value.length * 18) / 2, 34, P.textPri, value);
    tft.setTextSize(1); textOpaque((SCREEN_W - total.length * 6) / 2, 60, P.textSec, total);
    textOpaque(4, 77, P.textPri, "75%", 4);
    tft.fillRect(32, 79, SCREEN_W - 58, 5, P.bgCard);
    tft.fillRect(32, 79, Math.floor((SCREEN_W - 58) * .75), 5, P.cyan);
    textOpaque(4, 94, P.cyan, "MOVING", 9);
    textOpaque(104, 94, P.cyan, ">>>", 3);
    drawHints("GO/STOP", "MENU", "GOTO");
  },
  "main-uncalibrated": () => {
    const st = { ...S, frac: 0 };
    base(); drawStatusBar(st); drawPositionBar(4, 18, SCREEN_W - 8, st);
    tft.setTextSize(3); textOpaque(62, 34, P.textPri, "0*");
    tft.setTextSize(1); textOpaque(8, 60, P.textSec, "POSITION NOT CALIBRATED");
    textOpaque(4, 77, P.textPri, "75%", 4);
    tft.fillRect(32, 79, SCREEN_W - 58, 5, P.bgCard);
    tft.fillRect(32, 79, Math.floor((SCREEN_W - 58) * .75), 5, P.cyan);
    textOpaque(4, 94, P.green, "IDLE", 9);
    drawHints("GO/STOP", "MENU", "GOTO");
  },
  "menu": () => {
    base(); drawScreenHeader("MENU", P.purple);
    const labels = ["Manual Move", "Position", "Calibration", "Settings"];
    const badges = ["MOV", "POS", "CAL", "SET"];
    const cellW = SCREEN_W / 2, cellH = (CONTENT_BOTTOM - HEADER_H) / 2;
    for (let i = 0; i < 4; i++) {
      const col = i % 2, row = Math.floor(i / 2);
      const x = col * cellW, y = HEADER_H + row * cellH, sel = (i === 0);
      const tileBg = sel ? P.bgHighlight : P.bgBase;
      tft.fillRect(x, y, cellW, cellH, tileBg); tft.drawRect(x, y, cellW, cellH, P.divider);
      if (sel) { tft.drawRect(x + 1, y + 1, cellW - 2, cellH - 2, P.sel); tft.drawRect(x + 2, y + 2, cellW - 4, cellH - 4, P.sel); }
      const iconColor = i === 2 ? P.amber : (i === 3 ? P.purple : (sel ? P.sel : P.textSec));
      tft.fillRect(x + 29, y + 7, 22, 17, P.bgCard);
      tft.setTextSize(1); tft.setTextColor(iconColor, P.bgCard); tft.setCursor(x + 31, y + 12); tft.print(badges[i]);
      tft.setTextSize(1);
      tft.setTextColor(sel ? P.textPri : P.textSec, tileBg);
      tft.setCursor(x + (cellW - labels[i].length * 6) / 2, y + cellH - 13);
      tft.print(labels[i]);
    }
    drawHints("", "BACK", "OPEN");
  },
  "manual-move": () => {
    base(); drawScreenHeader("MANUAL MOVE");
    for (let i = 0; i < 3; i++) { const cx = 66 + i * 14; tft.fillTriangle(cx, 35, cx, 47, cx + 8, 41, P.textSec); }
    tft.setTextSize(1); textOpaque(59, 56, P.textSec, "STOPPED");
    textOpaque(34, 77, P.textPri, "75%", 4); tft.fillRect(58, 79, 72, 5, P.bgCard); tft.fillRect(58, 79, 54, 5, P.cyan);
    drawHints("BACK", "MAIN", "REVERSE");
  },
  "manual-move-running": () => {
    base(); drawScreenHeader("MANUAL MOVE");
    for (let i = 0; i < 3; i++) { const cx = 66 + i * 14; tft.fillTriangle(cx, 35, cx, 47, cx + 8, 41, P.cyan); }
    tft.setTextSize(1); textOpaque(59, 56, P.textSec, "FORWARD");
    textOpaque(34, 77, P.textPri, "75%", 4); tft.fillRect(58, 79, 72, 5, P.bgCard); tft.fillRect(58, 79, 54, 5, P.cyan);
    drawHints("BACK", "MAIN", "REVERSE");
  },
  "go-to-position": () => {
    base(); drawScreenHeader("GO TO POSITION"); tft.setTextSize(1);
    const barX = 24, barY = 29, barW = 112, currentX = barX + Math.floor(barW * S.position / S.travel), targetX = barX + Math.floor(barW * S.target / S.travel);
    textOpaque(4, 28, P.textSec, "E1"); textOpaque(142, 28, P.textSec, "E2");
    tft.fillRect(barX, barY, barW, 8, P.bgCard); tft.fillRect(barX, barY, currentX - barX, 8, P.green); tft.drawFastVLine(currentX, barY - 1, 10, P.textPri);
    for (let y = barY - 2; y < barY + 10; y += 3) tft.drawFastVLine(targetX, y, 2, P.purple);
    const value = formatSteps(S.target); tft.setTextSize(3); textOpaque((SCREEN_W - value.length * 18) / 2, 49, P.purple, value);
    tft.setTextSize(1); textOpaque(46, 79, P.textSec, "TARGET STEPS");
    drawHints("BACK", "MAIN", "GO");
  },
  "go-to-position-uncal": () => {
    base(); drawScreenHeader("GO TO POSITION"); tft.setTextSize(1);
    textOpaque(34, 49, P.amber, "NOT CALIBRATED", 15);
    drawHints("BACK", "MAIN", "");
  },
  "calibration": () => {
    base(); drawScreenHeader("CALIBRATION", P.amber); tft.setTextSize(1);
    textOpaque(22, 38, P.textSec, "Travel: 5 670 steps", 22);
    textOpaque(22, 55, P.textSec, "Center: 2 835 steps", 22);
    textOpaque(43, 78, P.green, "+ CALIBRATED", 12);
    drawHints("BACK", "MAIN", "RE-HOME");
  },
  "calibration-homing": () => {
    base(); drawScreenHeader("HOMING", P.amber); tft.setTextSize(1);
    textOpaque(35, 27, P.textPri, "Seeking END2...", 16);
    for (let i = 0; i < 6; i++) tft.fillCircle(52 + i * 11, 48, 3, i < 3 ? P.amber : P.textDim);
    textOpaque(47, 62, P.textSec, "Phase 3 / 6", 11);
    for (let i = 0; i < 5; i++) { const cx = 47 + i * 14; tft.fillTriangle(cx, 81, cx, 91, cx + 8, 86, P.amber); }
    drawHints("", "ABORT", "", true, false);
  },
  "settings": () => {
    listHeader("Settings");
    drawList([{ label: "Motion" }, { label: "Sleep" }, { label: "System" },
              { label: "Wireless" }], 0);
    drawHints("BACK", "MAIN", "OPEN");
  },
  "settings-motion": () => {
    listHeader("Motion");
    drawList([{ label: "Speed", value: "75%" }, { label: "Ramp", value: "200" },
              { label: "Microsteps", value: "32" },
              { label: "Endstop Mode", value: "Stop" },
              { label: "Homing Speed", value: "400us" }], 0);

// ── Render + export ─────────────────────────────────────────────────────────
const GROUPS = [
  ["Operating screens", ["main", "main-moving", "main-uncalibrated", "menu",
                          "manual-move", "manual-move-running",
                          "go-to-position", "go-to-position-uncal",
                          "calibration", "calibration-homing"]],
  ["Settings", ["settings", "settings-motion", "settings-sleep", "settings-system",
                 "settings-wireless", "value-edit-numeric", "value-edit-named"]],
  ["Wireless", ["wifi-mode", "wifi-scanning", "wifi-scan-results", "password-entry",
                 "wifi-connecting", "wifi-failed"]],
  ["Dialogs, service & system", ["homing-confirm", "error", "diagnostics",
                                  "motor-test", "ota-update"]],
];

const exported = {};

function renderTo(canvas, name, themeKey) {
  P = THEMES[themeKey];
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  tft = new Tft(ctx);
  SCREENS[name]();
}

function build() {
  const out = document.getElementById('out');
  const make = (name, themeKey, suffix) => {
    const fig = document.createElement('figure');
    const c = document.createElement('canvas');
    c.width = SCREEN_W; c.height = SCREEN_H;
    c.style.width = (SCREEN_W * SCALE) + 'px';
    c.style.height = (SCREEN_H * SCALE) + 'px';
    renderTo(c, name, themeKey);
    exported[name + suffix] = c.toDataURL('image/png');
    const cap = document.createElement('figcaption');
    cap.textContent = name + suffix + '.png';
    fig.append(c, cap);
    return fig;
  };

  for (const [title, names] of GROUPS) {
    const h = document.createElement('h2'); h.textContent = title; out.append(h);
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const n of names) grid.append(make(n, 'dark', ''));
    out.append(grid);
  }

  const h = document.createElement('h2');
  h.textContent = 'Alternative themes (samples)';
  out.append(h);
  const grid = document.createElement('div'); grid.className = 'grid';
  for (const n of ['main', 'menu', 'settings-system']) {
    grid.append(make(n, 'light', '--light'));
    grid.append(make(n, 'hc', '--high-contrast'));
  }
  out.append(grid);

  window.__EXPORTED__ = exported;
  document.title = 'ready:' + Object.keys(exported).length;
}
build();
</script>
