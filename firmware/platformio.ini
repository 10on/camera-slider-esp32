[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; min_spiffs gives 2 OTA app slots at ~1.9MB each (default gives ~1.31MB each, which BLE
; alone used ~90% of before graphics/icons were even added). huge_app.csv would give a
; single ~3MB slot but has no second OTA slot at all -- needed to support ArduinoOTA.
board_build.partitions = min_spiffs.csv
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit BusIO@^1.14.1
    teemuatlut/TMCStepper@^0.7.3
    robtillaart/INA226@^0.6.4

; Real firmware -- everything in src/ except the frozen hardware self-test image.
[esp32dev_common]
build_src_filter = +<*> -<selftest_main.cpp>

; USB flash -- first flash on blank hardware, or recovery when OTA is unreachable.
[env:usb]
extends = esp32dev_common

; OTA push over WiFi via `pio run -e ota -t upload` (ArduinoOTA, see wifi.cpp).
; upload_port defaults to the mDNS hostname set in wifi.cpp; override on the command line
; with `--upload-port <ip>` if mDNS resolution is flaky on your network.
[env:ota]
extends = esp32dev_common
upload_protocol = espota
upload_port = camera-slider.local

; Frozen hardware bring-up/diagnostic image (encoder, buttons, endstops, backlight,
; motor step test, INA226, ADXL345) -- kept standalone, not merged into the real
; firmware's runtime. Flash this to sanity-check wiring on a bench, independent of
; the real firmware's state. USB only (no WiFi/OTA in this image).
[env:selftest]
build_src_filter = -<*> +<selftest_main.cpp>
